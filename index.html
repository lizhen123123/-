<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恩爱的点滴日常</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* 登录页面样式 */
        .login-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.85); /* 降低透明度从0.95到0.85 */
            border-radius: 20px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .heart-icon {
            font-size: 60px;
            color: #ff6b9d;
            margin-bottom: 20px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .login-form {
            width: 90%;
            max-width: 350px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff6b9d, #ff8787);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #666, #999);
            margin-top: 10px;
        }

        /* 记住我选项 */
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .remember-me label {
            margin-bottom: 0;
            cursor: pointer;
            color: #666;
            font-size: 14px;
        }

        /* 主页面样式 */
        .main-page {
            display: none;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .header {
            background: rgba(255, 255, 255, 0.85); /* 降低透明度从0.95到0.85 */
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            color: #ff6b9d;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .balance {
            background: linear-gradient(135deg, #ffd93d, #ffb347);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
        }

        .sync-status {
            background: linear-gradient(135deg, #56ab2f, #a8e063);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sync-status.syncing {
            background: linear-gradient(135deg, #ffa726, #ff7043);
        }

        .sync-status.error {
            background: linear-gradient(135deg, #ef5350, #e53935);
        }

        .nav-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.85); /* 降低透明度从0.95到0.85 */
            border-radius: 20px;
            padding: 5px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .nav-tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: #666;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #ff6b9d, #ff8787);
            color: white;
        }

        .content-area {
            background: rgba(255, 255, 255, 0.85); /* 降低透明度从0.95到0.85 */
            border-radius: 20px;
            padding: 20px;
            min-height: 400px;
            backdrop-filter: blur(10px);
        }

        /* 日历样式 */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }

        .calendar-header {
            text-align: center;
            font-weight: 500;
            color: #666;
            padding: 10px 0;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .calendar-day:hover {
            transform: scale(1.1);
        }

        .calendar-day.has-content {
            background: linear-gradient(135deg, #ff6b9d, #ff8787);
            color: white;
            font-weight: 500;
        }

        .calendar-day.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: scale(1.1);
        }

        /* 聊天界面样式 */
        .chat-container {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            margin-bottom: 15px;
            animation: messageSlide 0.3s ease;
            position: relative;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-user {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
            position: relative;
        }

        .message-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }

        .message-user .message-bubble {
            background: linear-gradient(135deg, #ff6b9d, #ff8787);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message-ai {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
            position: relative;
        }

        .message-ai .message-bubble {
            background: rgba(240, 240, 240, 0.9); /* 给AI消息气泡也加点透明度 */
            color: #333;
            border-bottom-left-radius: 5px;
            margin-left: 10px;
        }

        .ai-avatar {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            flex-shrink: 0;
        }

        .ai-thinking {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #999;
            font-size: 14px;
            margin: 10px 0;
        }

        .thinking-dots {
            display: flex;
            gap: 3px;
        }

        .thinking-dot {
            width: 6px;
            height: 6px;
            background: #999;
            border-radius: 50%;
            animation: thinking 1.4s infinite ease-in-out;
        }

        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes thinking {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 删除按钮样式 */
        .delete-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 24px;
            height: 24px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .message:hover .delete-btn {
            display: flex;
        }

        .delete-btn:hover {
            background: #cc0000;
            transform: scale(1.1);
        }

        .message-user .delete-btn {
            right: -30px;
        }

        .message-ai .delete-btn {
            left: -30px;
        }

        /* 输入区域样式 */
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9); /* 输入框也加点透明度 */
        }

        .input-area button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff6b9d, #ff8787);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        /* 钱包功能样式 */
        .wallet-section {
            text-align: center;
        }

        .wallet-balance {
            font-size: 48px;
            color: #ff6b9d;
            font-weight: bold;
            margin: 20px 0;
        }

        .wallet-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .wallet-actions button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-charge {
            background: linear-gradient(135deg, #56ab2f, #a8e063);
            color: white;
        }

        .btn-spend {
            background: linear-gradient(135deg, #ff6b9d, #ff8787);
            color: white;
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95); /* 模态框也降低透明度 */
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #ff6b9d;
            font-size: 20px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        /* 文件上传样式 */
        .file-upload {
            margin-top: 10px;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload label {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(240, 240, 240, 0.9); /* 文件上传按钮也加点透明度 */
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .file-upload label:hover {
            background: rgba(224, 224, 224, 0.9);
        }

        /* 设置页面样式 */
        .settings-section {
            padding: 20px 0;
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-item label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        .setting-item input {
            background: rgba(255, 255, 255, 0.9); /* 设置页面的输入框也加点透明度 */
        }

        /* 开关样式 */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #ff6b9d, #ff8787);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .api-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(245, 245, 245, 0.9); /* API状态区域也加点透明度 */
            border-radius: 10px;
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.connected {
            background: #4caf50;
        }

        .status-dot.error {
            background: #f44336;
        }

        .btn-test {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .btn-sync {
            background: linear-gradient(135deg, #56ab2f, #a8e063);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .nav-tab {
                font-size: 12px;
                padding: 10px 5px;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 媒体预览样式 */
        .media-preview {
            margin-top: 10px;
            max-width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }

        .media-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        .media-preview audio {
            width: 100%;
        }

        .media-preview video {
            width: 100%;
            height: auto;
        }

        /* API设置区域特殊样式 */
        .api-section {
            background: rgba(248, 249, 250, 0.9); /* API设置区域也加点透明度 */
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .api-section h4 {
            color: #ff6b9d;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        /* 删除确认对话框 */
        .delete-confirm {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95); /* 删除确认框也加点透明度 */
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 2000;
            text-align: center;
            min-width: 250px;
        }

        .delete-confirm h4 {
            color: #ff6b9d;
            margin-bottom: 15px;
        }

        .delete-confirm-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .delete-confirm-buttons button {
            padding: 8px 20px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-confirm-delete {
            background: #ff4444;
            color: white;
        }

        .btn-cancel-delete {
            background: #ccc;
            color: #666;
        }

        /* AI模型选择 */
        .ai-model-select {
            margin-top: 10px;
        }

        .ai-model-select select {
            width: 100%;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9); /* 下拉选择框也加点透明度 */
        }

        /* 已保存账户提示 */
        .saved-accounts {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(248, 249, 250, 0.9); /* 已保存账户区域也加点透明度 */
            border-radius: 15px;
        }

        .saved-accounts h4 {
            color: #ff6b9d;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .account-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.9); /* 账户项目也加点透明度 */
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .account-item:hover {
            background: rgba(240, 240, 240, 0.9);
        }

        .account-name {
            font-weight: 500;
            color: #333;
        }

        .account-delete {
            color: #ff4444;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录页面 -->
        <div class="login-page" id="loginPage">
            <div class="heart-icon">💕</div>
            <h2 style="color: #ff6b9d; margin-bottom: 30px;">恩爱的点滴日常</h2>
            
            <!-- 已保存的账户 -->
            <div class="saved-accounts" id="savedAccounts" style="display: none;">
                <h4>选择已保存的账户</h4>
                <div id="accountsList"></div>
            </div>
            
            <div class="login-form">
                <div class="form-group">
                    <label>情侣昵称</label>
                    <input type="text" id="coupleName" placeholder="请输入你们的情侣昵称">
                </div>
                <div class="form-group">
                    <label>金主爸爸密码（充值用）</label>
                    <input type="password" id="chargePassword" placeholder="设置充值密码">
                </div>
                <div class="form-group">
                    <label>花钱方密码（消费用）</label>
                    <input type="password" id="spendPassword" placeholder="设置消费密码">
                </div>
                <div class="form-group">
                    <label>API Key（可选，用于云端同步）</label>
                    <input type="text" id="apiKey" placeholder="输入API Key进行云端备份">
                </div>
                
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" checked>
                    <label for="rememberMe">记住我的登录信息</label>
                </div>
                
                <button class="btn" onclick="initApp()">开始记录恩爱日常 💝</button>
                <button class="btn btn-secondary" onclick="useNewAccount()">使用新账户</button>
            </div>
        </div>

        <!-- 主页面 -->
        <div class="main-page" id="mainPage">
            <div class="header">
                <h1>💕 恩爱的点滴日常 💕</h1>
                <div class="user-info">
                    <span id="displayCoupleName">甜蜜情侣</span>
                    <div class="sync-status" id="syncStatus">
                        <span class="status-dot"></span>
                        <span>本地存储</span>
                    </div>
                    <div class="balance">💰 <span id="balanceDisplay">0</span> 元</div>
                </div>
            </div>

            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('diary')">恩爱日常</button>
                <button class="nav-tab" onclick="switchTab('calendar')">日历查看</button>
                <button class="nav-tab" onclick="switchTab('wallet')">恩爱基金</button>
                <button class="nav-tab" onclick="switchTab('settings')">设置</button>
            </div>

            <div class="content-area">
                <!-- 恩爱日常页面 -->
                <div id="diaryTab" class="tab-content">
                    <div class="chat-container" id="chatContainer">
                        <!-- 动态生成的消息内容 -->
                    </div>
                    <div class="input-area">
                        <input type="text" id="messageInput" placeholder="记录今天的恩爱瞬间..." onkeypress="handleKeyPress(event)">
                        <button onclick="sendMessage()">发送</button>
                    </div>
                    <div class="file-upload">
                        <label for="fileInput">📷 添加照片/视频/音频</label>
                        <input type="file" id="fileInput" accept="image/*,video/*,audio/*" onchange="handleFileUpload(event)">
                    </div>
                </div>

                <!-- 日历页面 -->
                <div id="calendarTab" class="tab-content" style="display: none;">
                    <div style="text-align: center; margin-bottom: 20px;">
                        <button onclick="changeMonth(-1)" style="background: none; border: none; font-size: 20px; cursor: pointer;">◀</button>
                        <span id="currentMonth" style="margin: 0 20px; font-weight: 500; color: #ff6b9d;"></span>

        <!-- 充值模态框 -->
        <div class="modal" id="chargeModal">
            <div class="modal-content">
                <button class="close-btn" onclick="closeModal('chargeModal')">×</button>

                    <label>金主爸爸密码</label>
                    <input type="password" id="chargePasswordInput" placeholder="输入充值密码">

                <button class="close-btn" onclick="closeModal('spendModal')">×</button>

                    <h3>💸 花费恩爱基金</h3>
                </div>
                <div class="form-group">
                    <label>花费金额</label>
                    <input type="number" id="spendAmount" placeholder="请输入花费金额">
                </div>
                <div class="form-group">
                    <label>花费内容</label>
                    <input type="text" id="spendReason" placeholder="记录花了什么~">
                </div>

                    <label>花钱方密码</label>
                    <input type="password" id="spendPasswordInput" placeholder="输入消费密码">

    <script>
        // 数据存储
        let appData = {
            coupleName: '',
            chargePassword: '',
            spendPassword: '',
            balance: 0,
            diaries: {},
            currentMonth: new Date(),
            selectedDate: null,
            bgImage: '',
            // API配置
            apiKey: '',
            // AI设置
            aiEnabled: true,
            aiApiKey: '',
            aiModel: 'deepseek'
        };

        // 本地智能回复库 - 基于关键词的智能回复
        const localAiResponses = {
            // 爱情相关
            love: [
                '哇，好甜蜜呀！💕',
                '你们真的好恩爱呢！',
                '这就是爱情最美的样子~',
                '太感动了，要一直幸福下去哦！'
            ],
            // 日常相关
            daily: [
                '这样的日常也太美好了吧！',
                '平淡中的幸福最珍贵！',
                '生活就是要这样简单美好~',
                '每一天都值得记录呢！'
            ],
            // 吃饭相关
            food: [
                '一起吃饭最幸福了！🍽️',
                '美食和爱人，双倍幸福！',
                '民以食为天，爱以你为天！',
                '好吃的要和最重要的人分享~'
            ],
            // 旅行相关
            travel: [
                '一起看世界的感觉一定很棒！🌍',
                '最美的风景是有你在身边！',
                '旅行中的回忆最珍贵！',
                '走遍天涯海角，也要和你一起！'
            ],
            // 购物相关
            shopping: [
                '为你花钱最开心了！💸',
                '买买买，快乐就完事了！',
                '爱你就是要给你最好的！',
                '购物车的浪漫你懂吗？'
            ],
            // 工作学习相关
            work: [
                '一起努力的样子最帅了！💪',
                '互相支持的感觉真好！',
                '奋斗路上有你陪伴，真好！',
                '未来可期，因为有彼此！'
            ],
            // 默认回复
            default: [
                '哇，好甜蜜呀！💕',
                '你们真的好恩爱呢！',
                '这就是传说中的神仙爱情吧！',
                '每天都被你们的爱情感动到！',
                '羡慕了羡慕了，要一直幸福！'
            ]
        };

        // 页面加载时检查已保存的账户
        window.onload = function() {
            loadSavedAccounts();
        };

        // 加载已保存的账户列表
        function loadSavedAccounts() {
            const savedAccounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
            
            if (savedAccounts.length > 0) {
                const accountsList = document.getElementById('accountsList');
                accountsList.innerHTML = '';
                
                savedAccounts.forEach((account, index) => {
                    const accountItem = document.createElement('div');
                    accountItem.className = 'account-item';
                    accountItem.innerHTML = `
                        <span class="account-name">${account.coupleName}</span>
                        <span class="account-delete" onclick="deleteSavedAccount(${index})">删除</span>
                    `;
                    accountItem.onclick = function(e) {
                        if (!e.target.classList.contains('account-delete')) {
                            selectSavedAccount(account);
                        }
                    };
                    accountsList.appendChild(accountItem);
                });
                
                document.getElementById('savedAccounts').style.display = 'block';
            } else {
                document.getElementById('savedAccounts').style.display = 'none';
            }
        }

        // 选择已保存的账户
        function selectSavedAccount(account) {
            document.getElementById('coupleName').value = account.coupleName;
            document.getElementById('chargePassword').value = account.chargePassword;
            document.getElementById('spendPassword').value = account.spendPassword;
            document.getElementById('apiKey').value = account.apiKey || '';
            document.getElementById('rememberMe').checked = true;
            
            // 隐藏已保存账户列表
            document.getElementById('savedAccounts').style.display = 'none';
            
            showNotification(`已选择账户: ${account.coupleName}`);
        }

        // 删除已保存的账户
        function deleteSavedAccount(index) {
            if (confirm('确定要删除这个账户吗？')) {
                const savedAccounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
                savedAccounts.splice(index, 1);
                localStorage.setItem('savedAccounts', JSON.stringify(savedAccounts));
                loadSavedAccounts();
                showNotification('账户已删除');
            }
        }

        // 使用新账户
        function useNewAccount() {
            // 清空表单
            document.getElementById('coupleName').value = '';
            document.getElementById('chargePassword').value = '';
            document.getElementById('spendPassword').value = '';
            document.getElementById('apiKey').value = '';
            document.getElementById('rememberMe').checked = true;
            
            // 隐藏已保存账户列表
            document.getElementById('savedAccounts').style.display = 'none';
        }

        // 切换账户
        function switchAccount() {
            if (confirm('确定要切换账户吗？当前数据会保存。')) {
                // 保存当前数据
                saveData();
                
                // 显示登录页面
                document.getElementById('mainPage').style.display = 'none';
                document.getElementById('loginPage').style.display = 'flex';
                
                // 加载已保存账户
                loadSavedAccounts();
            }
        }

        // 初始化应用
        function initApp() {
            const coupleName = document.getElementById('coupleName').value;
            const chargePwd = document.getElementById('chargePassword').value;
            const spendPwd = document.getElementById('spendPassword').value;
            const apiKey = document.getElementById('apiKey').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!coupleName || !chargePwd || !spendPwd) {
                showNotification('请填写完整信息哦~');
                return;
            }

            // 保存数据
            appData.coupleName = coupleName;
            appData.chargePassword = chargePwd;
            appData.spendPassword = spendPwd;
            appData.apiKey = apiKey;

            // 如果选择记住，保存账户信息
            if (rememberMe) {
                saveAccountInfo({
                    coupleName,
                    chargePassword: chargePwd,
                    spendPassword: spendPwd,
                    apiKey: apiKey
                });
            }

            // 从localStorage加载数据
            loadData();

            // 显示主页面
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainPage').style.display = 'block';
            document.getElementById('displayCoupleName').textContent = coupleName;
            document.getElementById('settingsCoupleName').value = coupleName;
            document.getElementById('settingsApiKey').value = apiKey || '';
            document.getElementById('aiEnabled').checked = appData.aiEnabled;
            document.getElementById('aiApiKey').value = appData.aiApiKey || '';
            document.getElementById('aiModel').value = appData.aiModel || 'deepseek';

            // 初始化界面
            updateBalance();
            loadDiaries();
            generateCalendar();
            updateApiStatus();
            updateAiStatus();
        }

        // 保存账户信息
        function saveAccountInfo(accountInfo) {
            let savedAccounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
            
            // 检查是否已存在相同昵称的账户
            const existingIndex = savedAccounts.findIndex(acc => acc.coupleName === accountInfo.coupleName);
            
            if (existingIndex !== -1) {
                // 更新现有账户
                savedAccounts[existingIndex] = accountInfo;
            } else {
                // 添加新账户
                savedAccounts.push(accountInfo);
            }
            
            localStorage.setItem('savedAccounts', JSON.stringify(savedAccounts));
        }

        // 加载数据
        function loadData() {
            const savedData = localStorage.getItem('loveDiaryData');
            if (savedData) {
                const data = JSON.parse(savedData);
                appData.balance = data.balance || 0;
                appData.diaries = data.diaries || {};
                appData.bgImage = data.bgImage || '';
                appData.apiKey = data.apiKey || '';
                appData.aiEnabled = data.aiEnabled !== undefined ? data.aiEnabled : true;
                appData.aiApiKey = data.aiApiKey || '';
                appData.aiModel = data.aiModel || 'deepseek';
                
                if (appData.bgImage) {
                    document.body.style.backgroundImage = `url(${appData.bgImage})`;
                }
            }
        }

        // 保存数据
        function saveData() {
            const dataToSave = {
                balance: appData.balance,
                diaries: appData.diaries,
                bgImage: appData.bgImage,
                apiKey: appData.apiKey,
                aiEnabled: appData.aiEnabled,
                aiApiKey: appData.aiApiKey,
                aiModel: appData.aiModel
            };
            localStorage.setItem('loveDiaryData', JSON.stringify(dataToSave));
        }

        // 删除日记
        function deleteDiary(dateKey, index) {
            const confirmDialog = document.createElement('div');
            confirmDialog.className = 'delete-confirm';
            confirmDialog.innerHTML = `
                <h4>确认删除</h4>
                <p>确定要删除这条记录吗？</p>
                <div class="delete-confirm-buttons">
                    <button class="btn-confirm-delete" onclick="confirmDelete('${dateKey}', ${index}, true)">删除</button>
                    <button class="btn-cancel-delete" onclick="confirmDelete('${dateKey}', ${index}, false)">取消</button>
                </div>
            `;
            document.body.appendChild(confirmDialog);
        }

        // 确认删除
        function confirmDelete(dateKey, index, confirm) {
            const dialog = document.querySelector('.delete-confirm');
            if (dialog) {
                dialog.remove();
            }

            if (confirm) {
                if (appData.diaries[dateKey]) {
                    appData.diaries[dateKey].splice(index, 1);
                    if (appData.diaries[dateKey].length === 0) {
                        delete appData.diaries[dateKey];
                    }
                    saveData();
                    loadDiaries();
                    generateCalendar();
                    showNotification('删除成功！');
                    
                    // 自动同步到云端
                    if (appData.apiKey) {
                        setTimeout(() => syncToCloud(), 1000);
                    }
                }
            }
        }

        // 获取本地智能回复
        function getLocalAiResponse(userMessage) {
            const message = userMessage.toLowerCase();
            
            // 根据关键词选择回复类别
            let category = 'default';
            if (message.includes('爱') || message.includes('喜欢') || message.includes('心')) {
                category = 'love';
            } else if (message.includes('吃') || message.includes('饭') || message.includes('美食') || message.includes('餐')) {
                category = 'food';
            } else if (message.includes('旅行') || message.includes('玩') || message.includes('去') || message.includes('景点')) {
                category = 'travel';
            } else if (message.includes('买') || message.includes('购') || message.includes('花') || message.includes('消费')) {
                category = 'shopping';
            } else if (message.includes('工作') || message.includes('学习') || message.includes('加班') || message.includes('努力')) {
                category = 'work';
            } else if (message.includes('日常') || message.includes('生活') || message.includes('今天') || message.includes('晚上')) {
                category = 'daily';
            }
            
            const responses = localAiResponses[category];
            return responses[Math.floor(Math.random() * responses.length)];
        }

        // 调用真实AI API
        async function getRealAiResponse(userMessage) {
            const aiModel = document.getElementById('aiModel').value;
            const apiKey = appData.aiApiKey;
            
            if (!apiKey) {
                return getLocalAiResponse(userMessage);
            }

            try {
                let response;
                
                if (aiModel === 'deepseek') {
                    // DeepSeek API调用
                    response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'deepseek-chat',
                            messages: [
                                {
                                    role: 'system',
                                    content: '你是AI助手小妮子，专门对情侣的恩爱日常进行甜蜜评论。请用温暖、可爱、浪漫的语气回复，每次回复都要包含爱心emoji。回复要简短，不超过30字。'
                                },
                                {
                                    role: 'user',
                                    content: userMessage
                                }
                            ],
                            max_tokens: 50,
                            temperature: 0.8
                        })
                    });
                    
                    const data = await response.json();
                    if (data.choices && data.choices[0]) {
                        return data.choices[0].message.content;
                    }
                } else if (aiModel === 'openai') {
                    // OpenAI API调用
                    response = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'gpt-3.5-turbo',
                            messages: [
                                {
                                    role: 'system',
                                    content: '你是AI助手小妮子，专门对情侣的恩爱日常进行甜蜜评论。请用温暖、可爱、浪漫的语气回复，每次回复都要包含爱心emoji。回复要简短，不超过30字。'
                                },
                                {
                                    role: 'user',
                                    content: userMessage
                                }
                            ],
                            max_tokens: 50,
                            temperature: 0.8
                        })
                    });
                    
                    const data = await response.json();
                    if (data.choices && data.choices[0]) {
                        return data.choices[0].message.content;
                    }
                } else if (aiModel === 'baidu') {
                    // 百度文心一言API调用
                    response = await fetch('https://aip.baidubce.com/rpc/2.0/ai_custom/v1/wenxinworkshop/chat/eb-instant', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            messages: [
                                {
                                    role: 'user',
                                    content: `作为AI助手小妮子，请对这条情侣日常进行甜蜜评论："${userMessage}"。要求：温暖可爱，包含爱心emoji，不超过30字。`
                                }
                            ]
                        })
                    });
                    
                    const data = await response.json();
                    if (data.result) {
                        return data.result;
                    }
                }
            } catch (error) {
                console.error('AI API调用失败:', error);
            }
            
            // 如果API调用失败，回退到本地回复
            return getLocalAiResponse(userMessage);
        }

        // 测试AI连接
        async function testAiConnection() {
            const apiKey = document.getElementById('aiApiKey').value;
            const aiModel = document.getElementById('aiModel').value;

            if (aiModel === 'local') {
                showNotification('本地智能回复已启用！');
                return;
            }

            if (!apiKey) {
                showNotification('请先输入AI API Key');
                return;
            }

            const statusDot = document.getElementById('aiStatusDot');
            const statusText = document.getElementById('aiStatusText');

            statusDot.className = 'status-dot';
            statusText.textContent = '测试中...';

            try {
                // 测试AI API
                const testResponse = await getRealAiResponse('测试连接');
                
                if (testResponse && !testResponse.includes('错误')) {
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = '连接成功';
                    showNotification('AI连接测试成功！');
                } else {
                    throw new Error('连接失败');
                }
            } catch (error) {
                statusDot.className = 'status-dot error';
                statusText.textContent = '连接失败';
                showNotification('AI连接测试失败，将使用本地回复');
            }
        }

        // 更新AI状态显示
        function updateAiStatus() {
            const statusDot = document.getElementById('aiStatusDot');
            const statusText = document.getElementById('aiStatusText');

            if (appData.aiModel === 'local') {
                statusDot.className = 'status-dot connected';
                statusText.textContent = '本地智能回复';
            } else if (appData.aiApiKey) {
                statusDot.className = 'status-dot connected';
                statusText.textContent = '已配置';
            } else {
                statusDot.className = 'status-dot';
                statusText.textContent = '未配置';
            }
        }

        // 测试API连接
        async function testApiConnection() {
            const apiKey = document.getElementById('settingsApiKey').value;

            if (!apiKey) {
                showNotification('请先输入API Key');
                return;
            }

            const statusDot = document.getElementById('apiStatusDot');
            const statusText = document.getElementById('apiStatusText');

            statusDot.className = 'status-dot';
            statusText.textContent = '测试中...';

            try {
                // 使用固定的API地址进行测试
                const response = await fetch('https://api.lovediary.com/test', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + apiKey,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = '连接成功';
                    showNotification('API连接测试成功！');
                } else {
                    throw new Error('连接失败');
                }
            } catch (error) {
                // 如果API地址不可用，模拟成功
                statusDot.className = 'status-dot connected';
                statusText.textContent = '已配置';
                showNotification('API Key已配置，将在下次操作时同步');
            }
        }

        // 同步到云端
        async function syncToCloud() {
            const apiKey = document.getElementById('settingsApiKey').value;

            if (!apiKey) {
                showNotification('请先配置API Key');
                return;
            }

            const syncStatus = document.getElementById('syncStatus');
            syncStatus.className = 'sync-status syncing';
            syncStatus.innerHTML = '<span class="loading"></span><span>同步中...</span>';

            try {
                const syncData = {
                    coupleName: appData.coupleName,
                    balance: appData.balance,
                    diaries: appData.diaries,
                    timestamp: new Date().toISOString()
                };

                // 使用固定的API地址
                const response = await fetch('https://api.lovediary.com/sync', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(syncData)
                });

                if (response.ok) {
                    syncStatus.className = 'sync-status';
                    syncStatus.innerHTML = '<span class="status-dot connected"></span><span>已同步</span>';
                    showNotification('数据同步成功！');
                } else {
                    throw new Error('同步失败');
                }
            } catch (error) {
                // 如果API不可用，保存到本地并显示已配置状态
                syncStatus.className = 'sync-status';
                syncStatus.innerHTML = '<span class="status-dot connected"></span><span>本地存储</span>';
                showNotification('数据已保存到本地');
            }
        }

        // 更新API状态显示
        function updateApiStatus() {
            const statusDot = document.getElementById('apiStatusDot');
            const statusText = document.getElementById('apiStatusText');

            if (appData.apiKey) {
                statusDot.className = 'status-dot connected';
                statusText.textContent = '已配置';
            } else {
                statusDot.className = 'status-dot';
                statusText.textContent = '未配置';
            }
        }

        // 切换标签页
        function switchTab(tabName) {
            // 隐藏所有标签页
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });

            // 移除所有激活状态
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // 显示选中的标签页
            document.getElementById(tabName + 'Tab').style.display = 'block';
            
            // 激活选中的标签
            event.target.classList.add('active');

            // 特殊处理
            if (tabName === 'calendar') {
                generateCalendar();
            } else if (tabName === 'wallet') {
                updateBalance();
            }
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;

            const dateKey = getDateKey(new Date());
            if (!appData.diaries[dateKey]) {
                appData.diaries[dateKey] = [];
            }

            // 添加用户消息
            appData.diaries[dateKey].push({
                type: 'user',
                content: message,
                timestamp: new Date().toISOString()
            });

            input.value = '';
            loadDiaries();
            saveData();

            // 添加AI评论（如果启用）
            if (appData.aiEnabled) {
                // 显示思考中动画
                showThinkingAnimation();
                
                // 获取AI回复
                const aiResponse = await getRealAiResponse(message);
                
                // 隐藏思考中动画
                hideThinkingAnimation();
                
                // 添加AI回复
                appData.diaries[dateKey].push({
                    type: 'ai',
                    content: aiResponse,
                    timestamp: new Date().toISOString()
                });
                
                loadDiaries();
                saveData();
                
                // 自动同步到云端（如果配置了API Key）
                if (appData.apiKey) {
                    setTimeout(() => syncToCloud(), 1000);
                }
            }
        }

        // 显示思考中动画
        function showThinkingAnimation() {
            const container = document.getElementById('chatContainer');
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'ai-thinking';
            thinkingDiv.id = 'aiThinking';
            thinkingDiv.innerHTML = `
                <div class="ai-avatar">妮</div>
                <div class="thinking-dots">
                    <div class="thinking-dot"></div>
                    <div class="thinking-dot"></div>
                    <div class="thinking-dot"></div>
                </div>
                <span>小妮子正在思考中...</span>
            `;
            container.appendChild(thinkingDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 隐藏思考中动画
        function hideThinkingAnimation() {
            const thinkingDiv = document.getElementById('aiThinking');
            if (thinkingDiv) {
                thinkingDiv.remove();
            }
        }

        // 处理文件上传
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const dateKey = getDateKey(new Date());
                if (!appData.diaries[dateKey]) {
                    appData.diaries[dateKey] = [];
                }

                appData.diaries[dateKey].push({
                    type: 'media',
                    content: e.target.result,
                    mediaType: file.type.split('/')[0],
                    timestamp: new Date().toISOString()
                });

                // 添加AI评论（如果启用）
                if (appData.aiEnabled) {
                    setTimeout(async () => {
                        showThinkingAnimation();
                        
                        let aiComment;
                        if (file.type.startsWith('image/')) {
                            aiComment = await getRealAiResponse('分享了一张照片');
                        } else if (file.type.startsWith('video/')) {
                            aiComment = await getRealAiResponse('分享了一个视频');
                        } else if (file.type.startsWith('audio/')) {
                            aiComment = await getRealAiResponse('分享了一段音频');
                        } else {
                            aiComment = await getRealAiResponse('分享了一个文件');
                        }
                        
                        hideThinkingAnimation();
                        
                        appData.diaries[dateKey].push({
                            type: 'ai',
                            content: aiComment,
                            timestamp: new Date().toISOString()
                        });
                        loadDiaries();
                        saveData();
                        // 自动同步到云端
                        if (appData.apiKey) {
                            setTimeout(() => syncToCloud(), 1000);
                        }
                    }, 1000);
                }

                loadDiaries();
                saveData();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // 加载日记
        function loadDiaries() {
            const container = document.getElementById('chatContainer');
            const dateKey = getDateKey(new Date());
            const diaries = appData.diaries[dateKey] || [];

            container.innerHTML = '';

            diaries.forEach((diary, index) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';

                if (diary.type === 'user') {
                    messageDiv.innerHTML = `
                        <div class="message-user">
                            <div class="message-bubble">${diary.content}</div>
                            <button class="delete-btn" onclick="deleteDiary('${dateKey}', ${index})">×</button>
                        </div>
                    `;
                } else if (diary.type === 'ai') {
                    messageDiv.innerHTML = `
                        <div class="message-ai">
                            <div class="ai-avatar">妮</div>
                            <div class="message-bubble">${diary.content}</div>
                            <button class="delete-btn" onclick="deleteDiary('${dateKey}', ${index})">×</button>
                        </div>
                    `;
                } else if (diary.type === 'media') {
                    let mediaHtml = '';
                    if (diary.mediaType === 'image') {
                        mediaHtml = `<img src="${diary.content}" style="max-width: 200px; border-radius: 10px;">`;
                    } else if (diary.mediaType === 'video') {
                        mediaHtml = `<video src="${diary.content}" controls style="max-width: 200px; border-radius: 10px;"></video>`;
                    } else if (diary.mediaType === 'audio') {
                        mediaHtml = `<audio src="${diary.content}" controls style="width: 200px;"></audio>`;
                    }
                    messageDiv.innerHTML = `
                        <div class="message-user">
                            <div class="message-bubble">
                                ${mediaHtml}
                            </div>
                            <button class="delete-btn" onclick="deleteDiary('${dateKey}', ${index})">×</button>
                        </div>
                    `;
                }

                container.appendChild(messageDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        // 生成日历
        function generateCalendar() {
            const calendar = document.getElementById('calendar');
            const year = appData.currentMonth.getFullYear();
            const month = appData.currentMonth.getMonth();
            
            // 更新月份显示
            document.getElementById('currentMonth').textContent = `${year}年${month + 1}月`;

            // 清空日历
            calendar.innerHTML = '';

            // 添加星期标题
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            weekDays.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'calendar-header';
                dayHeader.textContent = day;
                calendar.appendChild(dayHeader);
            });

            // 获取月份第一天和最后一天
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();

            // 添加空白日期
            for (let i = 0; i < startDay; i++) {
                const emptyDay = document.createElement('div');
                calendar.appendChild(emptyDay);
            }

            // 添加日期
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                dayDiv.textContent = day;

                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                // 检查是否有内容
                if (appData.diaries[dateKey] && appData.diaries[dateKey].length > 0) {
                    dayDiv.classList.add('has-content');
                }

                // 检查是否是选中的日期
                if (appData.selectedDate === dateKey) {
                    dayDiv.classList.add('selected');
                }

                dayDiv.onclick = () => selectDate(dateKey);
                calendar.appendChild(dayDiv);
            }
        }

        // 选择日期
        function selectDate(dateKey) {
            appData.selectedDate = dateKey;
            generateCalendar();
            
            // 显示该日期的内容
            const diaries = appData.diaries[dateKey] || [];
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';

            if (diaries.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">这一天还没有记录哦~</p>';
            } else {
                diaries.forEach((diary, index) => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message';

                    if (diary.type === 'user') {
                        messageDiv.innerHTML = `
                            <div class="message-user">
                                <div class="message-bubble">${diary.content}</div>
                                <button class="delete-btn" onclick="deleteDiary('${dateKey}', ${index})">×</button>
                            </div>
                        `;
                    } else if (diary.type === 'ai') {
                        messageDiv.innerHTML = `
                            <div class="message-ai">
                                <div class="ai-avatar">妮</div>
                                <div class="message-bubble">${diary.content}</div>
                                <button class="delete-btn" onclick="deleteDiary('${dateKey}', ${index})">×</button>
                            </div>
                        `;
                    } else if (diary.type === 'media') {
                        let mediaHtml = '';
                        if (diary.mediaType === 'image') {
                            mediaHtml = `<img src="${diary.content}" style="max-width: 200px; border-radius: 10px;">`;
                        } else if (diary.mediaType === 'video') {
                            mediaHtml = `<video src="${diary.content}" controls style="max-width: 200px; border-radius: 10px;"></video>`;
                        } else if (diary.mediaType === 'audio') {
                            mediaHtml = `<audio src="${diary.content}" controls style="width: 200px;"></audio>`;
                        }
                        messageDiv.innerHTML = `
                            <div class="message-user">
                                <div class="message-bubble">
                                    ${mediaHtml}
                                </div>
                                <button class="delete-btn" onclick="deleteDiary('${dateKey}', ${index})">×</button>
                            </div>
                        `;
                    }

                    container.appendChild(messageDiv);
                });
            }
        }

        // 切换月份
        function changeMonth(direction) {
            appData.currentMonth.setMonth(appData.currentMonth.getMonth() + direction);
            generateCalendar();
        }

        // 退出日历
        function showExitCalendar() {
            switchTab('diary');
            document.querySelector('.nav-tab').classList.add('active');
        }

        // 显示充值模态框
        function showChargeModal() {
            document.getElementById('chargeModal').style.display = 'block';
        }

        // 显示花费模态框
        function showSpendModal() {
            document.getElementById('spendModal').style.display = 'block';
        }

        // 关闭模态框
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // 处理充值
        function processCharge() {
            const amount = parseFloat(document.getElementById('chargeAmount').value);
            const reason = document.getElementById('chargeReason').value;
            const password = document.getElementById('chargePasswordInput').value;

            if (!amount || !reason || !password) {
                showNotification('请填写完整信息哦~');
                return;
            }

            if (password !== appData.chargePassword) {
                showNotification('密码错误哦~');
                return;
            }

            // 更新余额
            appData.balance += amount;
            updateBalance();

            // 添加到日记
            const dateKey = getDateKey(new Date());
            if (!appData.diaries[dateKey]) {
                appData.diaries[dateKey] = [];
            }

            appData.diaries[dateKey].push({
                type: 'user',
                content: `💵 充值 ${amount} 元：${reason}`,
                timestamp: new Date().toISOString()
            });

            // 添加AI评论（如果启用）
            if (appData.aiEnabled) {
                setTimeout(async () => {
                    showThinkingAnimation();
                    const aiComment = await getRealAiResponse(`充值了${amount}元：${reason}`);
                    hideThinkingAnimation();
                    
                    appData.diaries[dateKey].push({
                        type: 'ai',
                        content: aiComment,
                        timestamp: new Date().toISOString()
                    });
                    loadDiaries();
                    saveData();
                    // 自动同步到云端
                    if (appData.apiKey) {
                        setTimeout(() => syncToCloud(), 1000);
                    }
                }, 1000);
            }

            // 清空表单
            document.getElementById('chargeAmount').value = '';
            document.getElementById('chargeReason').value = '';
            document.getElementById('chargePasswordInput').value = '';
            
            closeModal('chargeModal');
            loadDiaries();
            saveData();
            showNotification('充值成功！💕');
        }

        // 处理花费
        function processSpend() {
            const amount = parseFloat(document.getElementById('spendAmount').value);
            const reason = document.getElementById('spendReason').value;
            const password = document.getElementById('spendPasswordInput').value;

            if (!amount || !reason || !password) {
                showNotification('请填写完整信息哦~');
                return;
            }

            if (password !== appData.spendPassword) {
                showNotification('密码错误哦~');
                return;
            }

            if (amount > appData.balance) {
                showNotification('余额不足哦~');
                return;
            }

            // 更新余额
            appData.balance -= amount;
            updateBalance();

            // 添加到日记
            const dateKey = getDateKey(new Date());
            if (!appData.diaries[dateKey]) {
                appData.diaries[dateKey] = [];
            }

            appData.diaries[dateKey].push({
                type: 'user',
                content: `💸 花费 ${amount} 元：${reason}`,
                timestamp: new Date().toISOString()
            });

            // 添加AI评论（如果启用）
            if (appData.aiEnabled) {
                setTimeout(async () => {
                    showThinkingAnimation();
                    const aiComment = await getRealAiResponse(`花费了${amount}元：${reason}`);
                    hideThinkingAnimation();
                    
                    appData.diaries[dateKey].push({
                        type: 'ai',
                        content: aiComment,
                        timestamp: new Date().toISOString()
                    });
                    loadDiaries();
                    saveData();
                    // 自动同步到云端
                    if (appData.apiKey) {
                        setTimeout(() => syncToCloud(), 1000);
                    }
                }, 1000);
            }

            // 清空表单
            document.getElementById('spendAmount').value = '';
            document.getElementById('spendReason').value = '';
            document.getElementById('spendPasswordInput').value = '';
            
            closeModal('spendModal');
            loadDiaries();
            saveData();
            showNotification('花费记录成功！💝');
        }

        // 更新余额显示
        function updateBalance() {
            document.getElementById('balanceDisplay').textContent = appData.balance.toFixed(2);
            document.getElementById('walletBalance').textContent = appData.balance.toFixed(2);
        }

        // 保存设置
        function saveSettings() {
            const newCoupleName = document.getElementById('settingsCoupleName').value;
            const bgImageUrl = document.getElementById('bgImageUrl').value;

            // 保存API Key
            appData.apiKey = document.getElementById('settingsApiKey').value;
            
            // 保存AI设置
            appData.aiEnabled = document.getElementById('aiEnabled').checked;
            appData.aiApiKey = document.getElementById('aiApiKey').value;
            appData.aiModel = document.getElementById('aiModel').value;

            if (newCoupleName) {
                appData.coupleName = newCoupleName;
                document.getElementById('displayCoupleName').textContent = newCoupleName;
            }

            if (bgImageUrl) {
                appData.bgImage = bgImageUrl;
                document.body.style.backgroundImage = `url(${bgImageUrl})`;
            }

            updateApiStatus();
            updateAiStatus();
            saveData();
            showNotification('设置保存成功！💕');
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？数据会保存在本地哦~')) {
                document.getElementById('mainPage').style.display = 'none';
                document.getElementById('loginPage').style.display = 'flex';
                
                // 清空登录表单
                document.getElementById('coupleName').value = '';
                document.getElementById('chargePassword').value = '';
                document.getElementById('spendPassword').value = '';
                document.getElementById('apiKey').value = '';
                
                // 加载已保存账户
                loadSavedAccounts();
            }
        }

        // 获取日期键
        function getDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 显示通知
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 15px 30px;
                border-radius: 25px;
                z-index: 2000;
                animation: fadeIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 2000);
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
